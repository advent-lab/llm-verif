[project]
name = "llm-verif"
version = "0.1.0"
description = "LLM-based Verilog coverage automation tool"
authors = [{ name = "Sean Lowe", email = "slowe8@asu.edu" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
	"annotated-types ~=0.7.0",
	"anyio ~=4.11.0",
	"certifi ~=2025.10.5",
	"charset-normalizer ~=3.4.4",
	"distro ~=1.9.0",
	"dotenv ~=0.9.9",
	"filelock ~=3.20.0",
	"fsspec ~=2025.9.0",
	"h11 ~=0.16.0",
	"hf-xet ~=1.1.10",
	"httpcore ~=1.0.9",
	"httpx ~=0.28.1",
	"huggingface-hub ~=0.35.3",
	"idna ~=3.11",
	"jinja2 ~=3.1.6",
	"jiter ~=0.11.1",
	"markupsafe ~=3.0.3",
	"mpmath ~=1.3.0",
	"networkx ~=3.5",
	"numpy ~=2.3.4",
	"nvidia-cublas-cu12 ~=12.8.4.1",
	"nvidia-cuda-cupti-cu12 ~=12.8.90",
	"nvidia-cuda-nvrtc-cu12 ~=12.8.93",
	"nvidia-cuda-runtime-cu12 ~=12.8.90",
	"nvidia-cudnn-cu12 ~=9.10.2.21",
	"nvidia-cufft-cu12 ~=11.3.3.83",
	"nvidia-cufile-cu12 ~=1.13.1.3",
	"nvidia-curand-cu12 ~=10.3.9.90",
	"nvidia-cusolver-cu12 ~=11.7.3.90",
	"nvidia-cusparse-cu12 ~=12.5.8.93",
	"nvidia-cusparselt-cu12 ~=0.7.1",
	"nvidia-nccl-cu12 ~=2.27.5",
	"nvidia-nvjitlink-cu12 ~=12.8.93",
	"nvidia-nvshmem-cu12 ~=3.3.20",
	"nvidia-nvtx-cu12 ~=12.8.90",
	"openai ~=2.6.0",
	"packaging ~=25.0",
	"pandas ~=2.3.3",
	"pydantic ~=2.12.3",
	"pydantic-core ~=2.41.4",
	"python-dateutil ~=2.9.0.post0",
	"python-dotenv ~=1.1.1",
	"pytz ~=2025.2",
	"pyyaml ~=6.0.3",
	"regex ~=2025.10.23",
	"requests ~=2.32.5",
	"safetensors ~=0.6.2",
	"six ~=1.17.0",
	"sniffio ~=1.3.1",
	"sourcelocation ~=1.1.8",
	"sympy ~=1.14.0",
	"tiktoken ~=0.12.0",
	"tokenizers ~=0.22.1",
	"torch ~=2.9.0",
	"tqdm ~=4.67.1",
	"transformers ~=4.57.1",
	"triton ~=3.5.0",
	"typing-extensions ~=4.15.0",
	"typing-inspection ~=0.4.2",
	"tzdata ~=2025.2",
	"urllib3 ~=2.5.0",
]

[project.scripts]
llm_verif = "llm_verif.llm_verif:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_verif*"]
