compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'  # Ensures bf16 is retained without being cast to a lower precision.
dynamo_config:
  dynamo_backend: TENSORRT  # Leverages TensorRT for high performance on NVIDIA GPUs; ensure model compatibility.
enable_cpu_affinity: true  # Sets CPU affinity to reduce cross-core latency.
fsdp_config:
  fsdp_activation_checkpointing: true  # Saves memory by checkpointing activations, at a small computational cost.
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP  # Wraps Transformer layers, ideal for handling large model blocks.
  fsdp_backward_prefetch: BACKWARD_PRE  # Prefetches layers for efficient backward pass.
  fsdp_cpu_ram_efficient_loading: true  # Loads weights into CPU RAM efficiently, useful for large model loading.
  fsdp_forward_prefetch: true  # Improves throughput by fetching layers during the forward pass.
  fsdp_offload_params: true  # Offloads parameters to CPU during backpropagation; helpful for memory-constrained scenarios.
  fsdp_sharding_strategy: HYBRID_SHARD  # Balances memory and speed by combining data and model parallelism.
  fsdp_state_dict_type: SHARDED_STATE_DICT  # Optimizes state dicts for large model saves.
  fsdp_sync_module_states: true  # Ensures consistency across GPU processes when loading weights.
  fsdp_use_orig_params: true  # Retains original parameter references for FSDP, improving state management.
machine_rank: 0
main_training_function: main
mixed_precision: bf16  # Uses bf16 for A100s, balancing memory and speed without stability issues common in fp16.
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false